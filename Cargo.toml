[package]
name = "state-collector"
version = "0.1.0"
edition = "2024"
default-run = "state-collector"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["clock"] }
clap = { version = "4.6.1", features = ["derive"] }
flate2 = "1.1.9"
libc = "0.2.177"
postcard = { version = "1.1.3", features = ["alloc"] }
rune = "0.14.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rune-modules = { version = "0.14.2", features = ["full"] }
tar = "0.4.46"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3.10.1"
rsn = "0.2.0"
